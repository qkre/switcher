<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스위처">
<meta name="theme-color" content="#111318">
<title>스위처 (직접 연결)</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --fg:#14171c; --muted:#6b7280;
    --line:#e3e6ea; --on:#1e7f4b; --off:#b03636; --accent:#2563eb;
    --chip:#eceef1; --warn:#8a6d1f; --warnbg:#fdf6e3;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#111318; --card:#1a1d24; --fg:#e8eaed; --muted:#9aa3af;
           --line:#2a2f39; --on:#2ea36a; --off:#d05252; --accent:#5b8cff;
           --chip:#252932; --warn:#e0c070; --warnbg:#2a2419; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
       -webkit-tap-highlight-color:transparent}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;word-break:break-all}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{appearance:none;border:none;border-radius:12px;padding:18px 12px;
         font-size:17px;font-weight:700;color:#fff;cursor:pointer;
         transition:transform .06s ease,opacity .15s ease}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:default}
  .on{background:var(--on)} .off{background:var(--off)}
  #status{margin-top:14px;padding:12px 14px;border-radius:12px;
          background:var(--card);border:1px solid var(--line);
          font-size:14px;color:var(--muted);min-height:44px;word-break:break-word}
  #status.ok{color:var(--on)} #status.err{color:var(--off)}
  .hide{display:none}

  .conn{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:12px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.up{background:var(--on)} .dot.down{background:var(--off)}
  .dot.busy{background:var(--accent)}
  .conn-btns{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
  .conn-btns button{padding:14px 6px;font-size:15px}
  .conn-btns .link{background:var(--accent)}
  .conn-btns .ghost{background:var(--chip);color:var(--fg)}

  .opt{display:flex;align-items:center;justify-content:space-between;
       padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .opt:first-of-type{border-top:none}
  .seg{display:flex;gap:6px}
  .seg span{padding:7px 14px;border-radius:9px;background:var(--chip);
            color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;
            user-select:none}
  .seg span.sel{background:var(--accent);color:#fff}

  .note{background:var(--warnbg);border:1px solid var(--line);color:var(--warn);
        border-radius:12px;padding:14px;font-size:14px;line-height:1.6;
        margin-bottom:12px}
  .note b{color:var(--fg)}
  .note code{background:var(--chip);color:var(--fg);padding:1px 5px;
             border-radius:5px;font-size:13px}
  .note a{color:var(--accent)}

  /* 시리/단축어로 열렸을 때 크게 보여주는 결과 */
  .auto{border-radius:14px;padding:22px 16px;margin-bottom:12px;text-align:center;
        border:1px solid var(--line);background:var(--card)}
  .auto-what{font-size:20px;font-weight:800;margin-bottom:6px}
  .auto-state{font-size:15px;color:var(--muted)}
  .auto.ok{background:var(--on);border-color:var(--on)}
  .auto.ok .auto-what,.auto.ok .auto-state{color:#fff}
  .auto.err{background:var(--off);border-color:var(--off)}
  .auto.err .auto-what,.auto.err .auto-state{color:#fff}
  .diag{font-size:12px;color:var(--muted);padding-top:9px;
        border-top:1px solid var(--line);margin-top:2px;
        word-break:break-all;line-height:1.45}

  /* ---- 배터리 ---- */
  .bat{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bat-pct{font-size:26px;font-weight:800;min-width:78px;
           font-variant-numeric:tabular-nums}
  .bat-bar{flex:1;height:12px;border-radius:99px;background:var(--chip);
           overflow:hidden}
  .bat-bar i{display:block;height:100%;width:0;border-radius:99px;
             background:var(--on);transition:width .3s ease}
  .bat-bar i.low{background:var(--off)}
  .bat-bar i.mid{background:#c98a1a}
  /* .ghost 는 연결 카드 안으로 한정된 규칙이라 여기선 직접 지정한다 */
  .bat-btn{width:100%;padding:12px;font-size:14px;
           background:var(--chip);color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>스위처</h1>
  <div class="sub" id="meta">폰이 스위처에 직접 연결합니다 (PC 불필요)</div>

  <!-- Web Bluetooth 를 못 쓰는 브라우저(사파리 등)에서만 보인다 -->
  <div class="note hide" id="unsupported">
    <b>이 브라우저는 블루투스를 쓸 수 없습니다.</b><br>
    iOS 사파리·크롬은 Web Bluetooth 를 지원하지 않습니다.<br><br>
    App Store 에서 <b>Bluefy</b> 를 설치한 뒤, 그 앱에서 이 주소를 여세요.
  </div>

  <div id="app">
    <!-- ?do=1:on 처럼 명령을 달고 열렸을 때만 보인다 (시리/단축어용) -->
    <div class="auto hide" id="autobar">
      <div class="auto-what" id="auto_what">—</div>
      <div class="auto-state" id="auto_state">준비 중...</div>
    </div>

    <div class="card">
      <h2>연결</h2>
      <div class="conn">
        <span class="dot" id="c_dot"></span>
        <span id="c_text">연결 안 됨</span>
      </div>
      <div class="conn-btns">
        <button class="link" id="c_connect" onclick="connect()">연결하기</button>
        <button class="ghost" id="c_disconnect" onclick="disconnect()">끊기</button>
      </div>
    </div>

    <div class="card">
      <h2>스위치1</h2>
      <div class="row">
        <button class="on"  onclick="send(1,'on')">ON</button>
        <button class="off" onclick="send(1,'off')">OFF</button>
      </div>
    </div>

    <div class="card hide" id="sw2">
      <h2>스위치2</h2>
      <div class="row">
        <button class="on"  onclick="send(2,'on')">ON</button>
        <button class="off" onclick="send(2,'off')">OFF</button>
      </div>
    </div>

    <div class="card hide" id="swall">
      <h2>둘 다</h2>
      <div class="row">
        <button class="on"  onclick="send('all','on')">모두 ON</button>
        <button class="off" onclick="send('all','off')">모두 OFF</button>
      </div>
    </div>

    <!-- 스위처가 표준 배터리 서비스(180f)를 제공할 때만 보인다 -->
    <div class="card hide" id="batcard">
      <h2>배터리</h2>
      <div class="bat">
        <div class="bat-pct" id="bat_pct">—</div>
        <div class="bat-bar"><i id="bat_fill"></i></div>
      </div>
      <button class="ghost bat-btn" onclick="readBattery()">새로고침</button>
    </div>

    <div class="card">
      <h2>설정</h2>
      <div class="opt">
        <span>스위처 종류</span>
        <div class="seg" id="seg_type">
          <span data-v="1">1구</span><span data-v="2">2구</span>
        </div>
      </div>
      <div class="opt">
        <span>ON/OFF 반대로</span>
        <div class="seg" id="seg_invert">
          <span data-v="0">그대로</span><span data-v="1">반대로</span>
        </div>
      </div>
      <div class="diag" id="diag">—</div>
      <div class="diag" id="svcinfo">기기 정보: 연결 후 표시됩니다.</div>
    </div>

    <div id="status">준비됨</div>
  </div>
</div>

<script>
/* 안드로이드 Flutter 앱(main.dart) 및 pyswitcherio 와 동일한 값 */
const SERVICE_UUID = '0000150b-0000-1000-8000-00805f9b34fb';
const CHAR_UUID    = '000015ba-0000-1000-8000-00805f9b34fb';

/* 표준 서비스. 스위처가 제공하지 않을 수도 있으므로 전부 실패해도 무해하게 다룬다.
   Web Bluetooth 는 requestDevice 때 optionalServices 에 적어둔 서비스만
   나중에 접근할 수 있다. 그래서 미리 후보를 다 적어둔다. */
const BATTERY_SERVICE = '0000180f-0000-1000-8000-00805f9b34fb';
const BATTERY_CHAR    = '00002a19-0000-1000-8000-00805f9b34fb';
const DEVINFO_SERVICE = '0000180a-0000-1000-8000-00805f9b34fb';
const DEVINFO_CHARS = {
  '00002a29-0000-1000-8000-00805f9b34fb': '제조사',
  '00002a24-0000-1000-8000-00805f9b34fb': '모델',
  '00002a26-0000-1000-8000-00805f9b34fb': '펌웨어',
  '00002a27-0000-1000-8000-00805f9b34fb': '하드웨어',
};
const OPTIONAL_SERVICES = [SERVICE_UUID, BATTERY_SERVICE, DEVINFO_SERVICE];

/* 명령 바이트: 1구 on=00 off=01 / 2구 on=05 off=03 */
const KEYS = {
  '1:on':  0x00, '1:off': 0x01,
  '2:on':  0x05, '2:off': 0x03,
};

const $ = s => document.querySelector(s);
let device = null;      // BluetoothDevice
let characteristic = null;
let busy = false;

/* ---------- 설정 (이 폰에만 저장) ---------- */
function load(key, dflt){
  try { const v = localStorage.getItem(key); return v === null ? dflt : v; }
  catch(e) { return dflt; }
}
function save(key, value){ try { localStorage.setItem(key, value); } catch(e) {} }

let devType = parseInt(load('type', '2'), 10) === 1 ? 1 : 2;
let invert  = load('invert', '0') === '1';

function renderSeg(id, value){
  document.querySelectorAll('#' + id + ' span').forEach(el => {
    el.classList.toggle('sel', el.dataset.v === String(value));
  });
}
function renderSettings(){
  renderSeg('seg_type', devType);
  renderSeg('seg_invert', invert ? 1 : 0);
  const one = devType !== 2;
  $('#sw2').classList.toggle('hide', one);
  $('#swall').classList.toggle('hide', one);
}
$('#seg_type').addEventListener('click', e => {
  if (!e.target.dataset.v) return;
  devType = parseInt(e.target.dataset.v, 10);
  save('type', devType); renderSettings();
});
$('#seg_invert').addEventListener('click', e => {
  if (!e.target.dataset.v) return;
  invert = e.target.dataset.v === '1';
  save('invert', invert ? '1' : '0'); renderSettings();
});

/* ---------- 표시 ---------- */
function setStatus(msg, cls){
  const el = $('#status'); el.textContent = msg; el.className = cls || '';
}
function setConn(state, text){
  $('#c_dot').className = 'dot ' + state;
  $('#c_text').textContent = text;
}
function connected(){
  return !!(device && device.gatt && device.gatt.connected && characteristic);
}
function setBusy(b){
  busy = b;
  document.querySelectorAll('.card button').forEach(x => x.disabled = b);
  if (!b) refresh();
}
function refresh(){
  const up = connected();
  setConn(up ? 'up' : 'down',
          up ? ('연결됨 · ' + (device.name || '이름 없음')) : '연결 안 됨');
  $('#c_connect').disabled = busy || up;
  $('#c_disconnect').disabled = busy || !up;
}

/* ---------- 연결 ---------- */
async function connect(){
  if (busy) return;
  setBusy(true);
  setConn('busy', '기기를 고르세요...');
  try {
    /* requestDevice 는 반드시 사용자가 누른 직후에만 호출할 수 있다.
       이름이 광고에서 빠질 때가 있어 서비스 UUID 로도 잡히게 필터를 둘 준다. */
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { services: [SERVICE_UUID] },
        { namePrefix: 'SWITCHER' }
      ],
      optionalServices: OPTIONAL_SERVICES
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setConn('busy', '연결하는 중...');
    await openGatt();
    setStatus('연결됐습니다.', 'ok');
  } catch (e) {
    characteristic = null;
    setStatus(describe(e), 'err');
  } finally {
    setBusy(false);
  }
}

async function openGatt(){
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  characteristic = await service.getCharacteristic(CHAR_UUID);
  /* 배터리/기기정보는 있으면 좋고 없어도 되는 부가 기능이다.
     여기서 실패해도 스위치 제어에는 영향이 없어야 한다. */
  setupBattery(server).catch(() => {});
  probeServices(server).catch(() => {});
}

/* ---------- 배터리 ---------- */
let batteryChar = null;

function showBattery(pct){
  $('#batcard').classList.remove('hide');
  $('#bat_pct').textContent = pct + '%';
  const fill = $('#bat_fill');
  fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  fill.className = pct <= 15 ? 'low' : (pct <= 40 ? 'mid' : '');
}

async function setupBattery(server){
  batteryChar = null;
  let bs;
  try {
    bs = await server.getPrimaryService(BATTERY_SERVICE);
  } catch (e) {
    // 이 기기는 표준 배터리 서비스를 제공하지 않는다
    $('#batcard').classList.add('hide');
    $('#bat_pct').textContent = '—';
    $('#bat_fill').style.width = '0';
    $('#bat_fill').className = '';
    return;
  }
  batteryChar = await bs.getCharacteristic(BATTERY_CHAR);
  try {
    await batteryChar.startNotifications();
    batteryChar.addEventListener('characteristicvaluechanged',
      e => showBattery(e.target.value.getUint8(0)));
  } catch (e) {
    // 알림을 지원하지 않으면 새로고침 버튼으로 읽으면 된다
  }
  await readBattery();
}

async function readBattery(){
  if (!batteryChar) return;
  try {
    const v = await batteryChar.readValue();
    showBattery(v.getUint8(0));
  } catch (e) {
    $('#bat_pct').textContent = '—';
    setStatus('배터리를 읽지 못했습니다: ' + describe(e), 'err');
  }
}

/* ---------- 기기가 실제로 뭘 제공하는지 (진단) ---------- */
async function probeServices(server){
  const found = [];
  for (const uuid of OPTIONAL_SERVICES) {
    try {
      const svc = await server.getPrimaryService(uuid);
      const chars = await svc.getCharacteristics();
      const short = uuid.slice(4, 8);
      found.push(short + '(' + chars.length + ')');
    } catch (e) { /* 없는 서비스 */ }
  }

  const info = [];
  try {
    const di = await server.getPrimaryService(DEVINFO_SERVICE);
    for (const [uuid, label] of Object.entries(DEVINFO_CHARS)) {
      try {
        const c = await di.getCharacteristic(uuid);
        const text = new TextDecoder().decode(await c.readValue()).trim();
        if (text) info.push(label + ' ' + text);
      } catch (e) { /* 없는 항목 */ }
    }
  } catch (e) { /* 기기정보 서비스 없음 */ }

  const parts = ['서비스: ' + (found.join(' ') || '없음')];
  if (info.length) parts.push(info.join(' · '));
  if (!found.some(f => f.startsWith('180f'))) {
    parts.push('배터리 서비스(180f) 없음 - 이 기기는 잔량을 알려주지 않습니다.');
  }
  $('#svcinfo').textContent = '기기 정보: ' + parts.join(' | ');
}

function onDisconnected(){
  characteristic = null;
  batteryChar = null;
  $('#batcard').classList.add('hide');
  setStatus('연결이 끊겼습니다. 다시 연결하세요.', 'err');
  refresh();
}

async function disconnect(){
  if (busy) return;
  setBusy(true);
  try {
    if (device && device.gatt && device.gatt.connected) device.gatt.disconnect();
    characteristic = null;
    setStatus('연결을 끊었습니다.', 'ok');
  } finally {
    setBusy(false);
  }
}

/* ---------- 명령 ---------- */
async function writeKey(index, action){
  const byte = KEYS[index + ':' + action];
  if (byte === undefined) throw new Error('알 수 없는 명령');
  const data = new Uint8Array([byte]);
  /* 기기에 따라 응답을 요구하기도, 안 하기도 한다. 지원하는 쪽으로 쓴다. */
  if (characteristic.properties && characteristic.properties.write) {
    await characteristic.writeValueWithResponse(data);
  } else {
    await characteristic.writeValueWithoutResponse(data);
  }
}

async function send(target, action){
  if (busy) return;
  if (invert) action = (action === 'on') ? 'off' : 'on';

  const targets = (target === 'all') ? (devType === 2 ? [1, 2] : [1]) : [target];
  setBusy(true);
  setStatus((target === 'all' ? '둘 다 ' : '스위치' + target + ' ')
            + action.toUpperCase() + ' 전송 중...');
  try {
    if (!connected()){
      /* 끊겨 있으면 한 번 되살려 본다. 이미 고른 기기라 선택창은 안 뜬다. */
      if (!device) throw new Error('먼저 연결하기를 누르세요.');
      await openGatt();
    }
    for (const t of targets) await writeKey(t, action);
    setStatus('전송 완료', 'ok');
  } catch (e) {
    setStatus('실패: ' + describe(e), 'err');
  } finally {
    setBusy(false);
  }
}

function describe(e){
  const msg = (e && e.message) ? e.message : String(e);
  if (e && e.name === 'NotFoundError') return '기기를 고르지 않았거나 찾지 못했습니다.';
  if (e && e.name === 'SecurityError')
    return 'HTTPS 페이지에서만 블루투스를 쓸 수 있습니다.';
  if (e && e.name === 'NetworkError')
    return '연결이 끊겼습니다. 스위처에 가까이 가서 다시 시도하세요.';
  return msg;
}

/* ---------- 시리/단축어 자동 실행 ----------
   주소 뒤에 ?do=1:on  ?do=2:off  ?do=all:off 를 붙여 열면
   페이지가 뜨자마자 알아서 연결하고 명령을 보낸다.

   requestDevice(기기 선택창)는 반드시 손가락 터치가 있어야 하지만,
   getDevices()로 기억된 기기를 꺼내 connect()하는 건 터치 없이 된다.
   브라우저가 getDevices()를 지원하지 않으면 자동 실행은 불가능하고,
   한 번 눌러서 기기를 골라야 한다. */

function autoLabel(target, action){
  const who = (target === 'all') ? '둘 다' : '스위치' + target;
  return who + ' ' + (action === 'on' ? '켜기' : '끄기');
}

async function rememberedDevice(){
  if (!navigator.bluetooth.getDevices) return null;
  try {
    const list = await navigator.bluetooth.getDevices();
    return (list && list.length) ? list[0] : null;
  } catch (e) {
    return null;
  }
}

async function runAuto(spec){
  const [target, action] = spec.split(':');
  const valid = ['1', '2', 'all'].includes(target) && ['on', 'off'].includes(action);
  const bar = $('#autobar');
  bar.classList.remove('hide');

  if (!valid) {
    bar.classList.add('err');
    $('#auto_what').textContent = '잘못된 명령';
    $('#auto_state').textContent = 'do=1:on / 2:off / all:off 형태여야 합니다.';
    return;
  }

  $('#auto_what').textContent = autoLabel(target, action);
  $('#auto_state').textContent = '연결하는 중...';

  const known = await rememberedDevice();
  if (!known) {
    bar.classList.add('err');
    $('#auto_state').textContent =
      '기억된 기기가 없습니다. 아래 연결하기를 눌러 한 번 골라주세요.';
    return;
  }

  device = known;
  device.addEventListener('gattserverdisconnected', onDisconnected);
  try {
    await openGatt();
    $('#auto_state').textContent = '전송 중...';
    await send(target, action);
    bar.classList.add('ok');
    $('#auto_state').textContent = '완료';
  } catch (e) {
    bar.classList.add('err');
    $('#auto_state').textContent = describe(e);
  }
}

/* ---------- 시작 ---------- */
if (!navigator.bluetooth) {
  $('#unsupported').classList.remove('hide');
  $('#app').classList.add('hide');
} else {
  renderSettings();
  refresh();

  const supportsGetDevices = !!navigator.bluetooth.getDevices;
  $('#diag').textContent = supportsGetDevices
    ? '기기 기억(getDevices) 지원 — 시리 자동 실행 가능'
    : '기기 기억(getDevices) 미지원 — 시리 자동 실행 불가, 매번 기기를 골라야 합니다';

  const spec = new URLSearchParams(location.search).get('do');
  if (spec) {
    runAuto(spec);
  } else {
    rememberedDevice().then(known => {
      if (known && !device) {
        device = known;
        device.addEventListener('gattserverdisconnected', onDisconnected);
        setStatus('이전 기기를 기억하고 있습니다. 연결하기를 누르세요.');
        refresh();
      }
    });
  }
}
</script>
</body>
</html>
